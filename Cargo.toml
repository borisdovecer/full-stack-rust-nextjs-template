[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates
app-core = { path = "crates/core" }
app-db = { path = "crates/db" }
app-auth = { path = "crates/auth" }
app-mail = { path = "crates/mail" }

# Async
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }

# HTTP
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.7", features = ["trace", "catch-panic", "timeout", "compression-gzip", "limit", "util"] }
http-body-util = "0.1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

# Auth
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
subtle = "2.6"
base64 = "0.23"
# Solana wallet sign-in: Ed25519 signatures and base58 addresses
ed25519-dalek = "3"
bs58 = "0.5"

# API docs
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"

# Help docs
include_dir = "0.7"

# Config and CLI
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
toml = "1.2"
rpassword = "7.5"

# Mail (Resend's HTTP API); the same TLS stack Sentry already uses
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }

# Utility
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
