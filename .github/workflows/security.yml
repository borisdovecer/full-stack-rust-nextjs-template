name: Security

# Known vulnerabilities in dependencies, and secrets in the history. Also weekly, because new
# advisories appear without any change here. Locally: scripts/check.sh security.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ignored advisories, each with its reason, are in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  web-advisories:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      # Only what ships to the browser, and only high or critical: moderate findings in
      # dependencies without a fix would block every change.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner .
